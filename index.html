<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bus 21">
<meta name="theme-color" content="#0a6b3b">
<title>Bus 21 to Métro</title>
<style>
  :root{ --green:#0a6b3b; --green2:#0d8a4d; --ink:#12241b; --muted:#8a988f; --bg:#f4f7f5; --card:#ffffff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        background:var(--bg); color:var(--ink);
        padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 20px);
        display:flex; flex-direction:column; gap:14px; max-width:560px; margin:0 auto; }
  .top{ text-align:center; }
  .day{ font-size:19px; font-weight:600; color:var(--green); letter-spacing:.2px; }
  .clock{ font-size:15px; color:var(--muted); margin-top:2px; }

  .hero{ background:var(--green); color:#fff; border-radius:22px; padding:22px 20px 24px; text-align:center;
         box-shadow:0 8px 24px rgba(10,107,59,.22); }
  .hero .lbl{ font-size:15px; text-transform:uppercase; letter-spacing:1.5px; opacity:.85; }
  .hero .time{ font-size:60px; font-weight:800; line-height:1.02; margin:6px 0 2px; }
  .hero .countdown{ font-size:26px; font-weight:600; }
  .hero.soon{ background:#c2410c; box-shadow:0 8px 24px rgba(194,65,12,.28); }

  .missed{ background:#eef1ef; border-radius:16px; padding:12px 18px; text-align:center; color:var(--muted); font-size:15px; }
  .missed b{ color:var(--ink); font-weight:700; }

  .listlbl{ font-size:13px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin:2px 4px -2px; }
  .row{ background:var(--card); border-radius:16px; padding:16px 20px; display:flex; align-items:baseline;
        justify-content:space-between; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .row .t{ font-size:28px; font-weight:700; }
  .row .m{ font-size:17px; color:var(--muted); font-weight:600; }

  .foot{ text-align:center; color:var(--muted); font-size:12.5px; line-height:1.5; margin-top:4px; }
  .foot b{ color:var(--ink); }
  .hint{ background:#fff7e6; border:1px solid #f2d492; color:#7a5a12; border-radius:14px;
         padding:12px 16px; font-size:13.5px; line-height:1.5; text-align:center; }
  .hint.hide{ display:none; }
</style>
</head>
<body>
  <div class="top">
    <div class="day" id="day">—</div>
    <div class="clock" id="clock">—</div>
  </div>

  <div class="hero" id="hero">
    <div class="lbl">Next bus</div>
    <div class="time" id="nextTime">—</div>
    <div class="countdown" id="nextCountdown">—</div>
  </div>

  <div class="missed" id="missed"></div>

  <div class="listlbl">Then</div>
  <div class="row" id="r2"><span class="t">—</span><span class="m"></span></div>
  <div class="row" id="r3"><span class="t">—</span><span class="m"></span></div>
  <div class="row" id="r4"><span class="t">—</span><span class="m"></span></div>

  <div class="hint" id="hint">
    Tip: tap the <b>Share</b> button below, then <b>“Add to Home Screen”</b> — it'll live on your phone like an app.
  </div>

  <div class="foot">
    Bus <b>21</b> · direction <b>Terminus Longueuil</b> (Métro Longueuil)<br>
    Stop: <b>Grande Allée / Édouard</b> · ~10 min to the metro<br>
    Uses your phone's clock — no internet needed.
  </div>

<script>
// ---- Scheduled passing times at Grande Allée / Édouard, toward Terminus Longueuil ----
// Minutes after midnight of the SERVICE day (values > 1440 = after midnight, next calendar day).
var SCHED = {
  week: [307,353,380,395,410,425,437,449,464,479,501,519,536,559,572,592,613,640,674,704,
         734,766,799,829,859,897,922,952,985,1000,1015,1029,1044,1062,1081,1097,1117,1143,
         1170,1195,1225,1255,1284,1314,1344,1402,1459],
  sat:  [370,400,430,460,492,522,552,582,612,637,668,702,735,761,795,827,857,887,917,947,
         977,1007,1037,1067,1097,1127,1153,1180,1210,1240,1270,1300,1330,1360,1390,1420,1450,1480,1510],
  sun:  [370,400,430,459,489,519,550,580,610,637,670,700,732,762,793,827,857,887,917,947,
         977,1007,1037,1067,1097,1127,1153,1180,1210,1240,1270,1300,1330,1360,1390,1420,1450,1480]
};

function typeFor(d){ var g=d.getDay(); return g===0?'sun':(g===6?'sat':'week'); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0,0,0,0); }

function departures(now){
  var out=[];
  for(var off=-1; off<=1; off++){
    var base=midnight(new Date(now.getFullYear(),now.getMonth(),now.getDate()+off));
    var list=SCHED[typeFor(base)];
    for(var i=0;i<list.length;i++){ out.push(new Date(base.getTime()+list[i]*60000)); }
  }
  out.sort(function(a,b){return a-b;});
  return out;
}

function fmt(d){
  var h=d.getHours(), m=d.getMinutes(), ap=h<12?'AM':'PM';
  var hh=h%12; if(hh===0) hh=12;
  return hh+':'+(m<10?'0':'')+m+' '+ap;
}
function fmtClock(d){
  var h=d.getHours(), m=d.getMinutes(), s=d.getSeconds(), ap=h<12?'AM':'PM';
  var hh=h%12; if(hh===0) hh=12;
  return hh+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s+' '+ap;
}
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function render(){
  var now=new Date();
  document.getElementById('day').textContent = DAYS[now.getDay()];
  document.getElementById('clock').textContent = 'Right now: '+fmtClock(now);

  var deps=departures(now);
  var past=null, upcoming=[];
  for(var i=0;i<deps.length;i++){
    if(deps[i] <= now) past=deps[i];
    else if(upcoming.length<4) upcoming.push(deps[i]);
  }

  var hero=document.getElementById('hero');
  if(upcoming.length>0){
    var mins=Math.round((upcoming[0]-now)/60000);
    document.getElementById('nextTime').textContent = fmt(upcoming[0]);
    document.getElementById('nextCountdown').textContent = mins<=0 ? 'now' : ('in '+mins+' min');
    if(mins<=5){ hero.classList.add('soon'); } else { hero.classList.remove('soon'); }
  } else {
    document.getElementById('nextTime').textContent = '—';
    document.getElementById('nextCountdown').textContent = 'no more today';
    hero.classList.remove('soon');
  }

  var missed=document.getElementById('missed');
  if(past){
    var ago=Math.round((now-past)/60000);
    missed.innerHTML = 'Just left: <b>'+fmt(past)+'</b> &nbsp;('+ago+' min ago)';
    missed.style.display='';
  } else { missed.style.display='none'; }

  var rows=['r2','r3','r4'];
  for(var k=0;k<3;k++){
    var el=document.getElementById(rows[k]);
    var dep=upcoming[k+1];
    if(dep){
      var mm=Math.round((dep-now)/60000);
      el.querySelector('.t').textContent = fmt(dep);
      el.querySelector('.m').textContent = 'in '+mm+' min';
      el.style.display='';
    } else { el.style.display='none'; }
  }
}

if(window.navigator.standalone === true){ document.getElementById('hint').classList.add('hide'); }

render();
setInterval(render, 5000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });
</script>
</body>
</html>
